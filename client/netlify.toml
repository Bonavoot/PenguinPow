[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Skip local bake; download prebuilt sprites (hat WebP bake exceeds build time limits).
  SKIP_BAKE = "1"
  BAKE_ARCHIVE_URL = "https://github.com/Bonavoot/PenguinPow/releases/download/bake-v2-hats/baked.tar.gz" 