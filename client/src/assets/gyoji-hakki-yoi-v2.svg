  <!-- A second imperfect ink pass gives the burst weight after effects settle. -->
  <path
    d="M 190 305 L 139 270 M 311 205 L 276 148 M 1204 258 L 1334 246 M 1196 474 L 1262 522"
    fill="none"
    stroke="#111111"
    stroke-width="3.5"
    stroke-linecap="round"
    opacity="0.48"
  />
</svg>
