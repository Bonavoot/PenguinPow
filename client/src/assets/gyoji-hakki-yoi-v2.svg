        L 302 228
        L 247 121
        L 420 177
        L 414 54
        L 562 151
        L 630 33
        L 731 145
        L 838 39
        L 910 157
        L 1063 67
        L 1052 188
        L 1252 123
        L 1195 242
        L 1453 222
        L 1313 320
        L 1535 374
        L 1288 406
        L 1437 526
        L 1191 470
        L 1230 607
        L 1041 509
