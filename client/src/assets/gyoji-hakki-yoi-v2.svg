<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 660" role="img" aria-labelledby="title desc">
  <title id="title">Gyoji explosive command balloon</title>
  <desc id="desc">An asymmetrical hand-inked rupture balloon with a narrow center tail for the Gyoji's Hakki-Yoi command.</desc>

  <!--
    The viewBox deliberately matches the original 1600 x 660 asset so this can
    replace it without changing the working in-game width, anchor, or offset.
    Keep live text in React/HTML; this file is only the illustrated silhouette.
  -->
