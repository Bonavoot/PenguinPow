  </g>

  <!-- Sparse impact flecks: a few authored marks, not a decorative halo. -->
  <g fill="#111111">
    <path d="M 86 176 L 161 151 L 122 204 Z"/>
    <path d="M 1377 130 L 1469 98 L 1410 174 Z"/>
    <path d="M 1472 515 L 1553 555 L 1461 552 Z"/>
