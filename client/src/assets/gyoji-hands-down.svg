<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Gyoji calm speech bubble</title>
  <desc id="desc">A wide, softly irregular speech balloon with a center-bottom tail for the Gyoji's Hands Down command.</desc>

  <!-- The tail is a separate path so it can be repositioned or hidden easily. -->
  <path
    id="tail"
    d="M 494 244 C 548 300 566 357 576 415 C 636 378 670 318 706 244 Z"
    fill="#fffaf0"
    stroke="#111111"
    stroke-width="20"
