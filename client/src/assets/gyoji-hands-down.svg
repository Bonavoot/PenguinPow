      C 979 354 897 355 843 329
      C 779 362 694 362 632 332
      C 568 365 481 363 420 332
      C 359 361 275 357 225 325
      C 157 338 91 310 84 261
      C 39 238 29 188 59 155
      C 54 107 96 72 154 64
